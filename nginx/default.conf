# Serves the production build (dist/). /api and /ws never reach this server: the reverse proxy
# sends them to the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # The reverse proxy and the API log the requests that matter.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed file names: they never change, so they can be cached for good. A missing one is a 404,
    # not the app's page.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (index.html, sw.js, the manifest, icons) is revalidated on every load, so
    # updates reach installed apps. Unknown paths are routes of the app: they get index.html.
    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
